<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8762A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0651F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#backgroundGradient)"/>
  
  <!-- Game grid dots (5x5 grid) -->
  <g fill="#F5E6D3" stroke="#E8D5B7" stroke-width="1">
    <!-- Row 1 -->
    <circle cx="100" cy="80" r="14"/>
    <circle cx="180" cy="80" r="14"/>
    <circle cx="260" cy="80" r="14"/>
    <circle cx="340" cy="80" r="14"/>
    <circle cx="420" cy="80" r="14"/>
    
    <!-- Row 2 -->
    <circle cx="100" cy="140" r="14"/>
    <circle cx="180" cy="140" r="14"/>
    <circle cx="260" cy="140" r="14"/>
    <circle cx="340" cy="140" r="14"/>
    <circle cx="420" cy="140" r="14"/>
    
    <!-- Row 3 -->
    <circle cx="100" cy="200" r="14"/>
    <circle cx="180" cy="200" r="14"/>
    <circle cx="260" cy="200" r="14"/>
    <circle cx="340" cy="200" r="14"/>
    <circle cx="420" cy="200" r="14"/>
    
    <!-- Row 4 -->
    <circle cx="100" cy="260" r="14"/>
    <circle cx="180" cy="260" r="14"/>
    <circle cx="260" cy="260" r="14"/>
    <circle cx="340" cy="260" r="14"/>
    <circle cx="420" cy="260" r="14"/>
    
    <!-- Row 5 -->
    <circle cx="100" cy="320" r="14"/>
    <circle cx="180" cy="320" r="14"/>
    <circle cx="260" cy="320" r="14"/>
    <circle cx="340" cy="320" r="14"/>
    <circle cx="420" cy="320" r="14"/>
  </g>
  
  <!-- Connecting lines forming boxes (matching the pattern in the image) -->
  <g stroke="#F5E6D3" stroke-width="5" fill="none" stroke-linecap="round">
    <!-- Top-left box -->
    <line x1="100" y1="80" x2="180" y2="80"/>
    <line x1="180" y1="80" x2="180" y2="140"/>
    <line x1="180" y1="140" x2="100" y2="140"/>
    <line x1="100" y1="140" x2="100" y2="80"/>
    
    <!-- Middle box -->
    <line x1="260" y1="140" x2="340" y2="140"/>
    <line x1="340" y1="140" x2="340" y2="200"/>
    <line x1="340" y1="200" x2="260" y2="200"/>
    <line x1="260" y1="200" x2="260" y2="140"/>
    
    <!-- Some partial lines for visual interest -->
    <line x1="180" y1="200" x2="260" y2="200"/>
    <line x1="340" y1="260" x2="420" y2="260"/>
  </g>
  
  <!-- Game title -->
  <text x="256" y="380" font-family="Georgia, serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#F5E6D3" stroke="#E8D5B7" stroke-width="1">Dots &amp; Boxes</text>
  
  <!-- Decorative corner element (matching the image) -->
  <g fill="#F5E6D3" opacity="0.6">
    <polygon points="480,480 500,460 500,500 460,500" transform="rotate(45 480 480)"/>
  </g>
</svg>